    // --- LIGHTWEIGHT DEBOUNCED INPUT COMPONENT ---
    // Keeps keystrokes local to the input element for instant typing responsiveness,
    // and only commits to global React state after the user pauses typing (or on blur/Enter).
    const DebouncedInput = React.memo(({ value, onChange, delay = 220, type = "text", ...props }) => {
      const [localVal, setLocalVal] = useState(value);
      const timerRef = useRef(null);
      const isFocusedRef = useRef(false);

      useEffect(() => {
        if (!isFocusedRef.current) {
          setLocalVal(value);
        }
      }, [value]);

      useEffect(() => {
        return () => {
          if (timerRef.current) clearTimeout(timerRef.current);
        };
      }, []);

      const commitValue = (rawVal) => {
        if (type === "number") {
          const parsed = props.step && String(props.step).includes(".")
            ? parseFloat(rawVal)
            : parseFloat(rawVal);
          const minFallback = props.min !== undefined ? parseFloat(props.min) : 0;
          onChange(isNaN(parsed) ? minFallback : parsed);
        } else {
          onChange(rawVal);
        }
      };

      const handleChange = (e) => {
        const nextVal = e.target.value;
        setLocalVal(nextVal);
        if (timerRef.current) clearTimeout(timerRef.current);
        timerRef.current = setTimeout(() => {
          commitValue(nextVal);
        }, delay);
      };

      const handleBlur = (e) => {
        isFocusedRef.current = false;
        if (timerRef.current) {
          clearTimeout(timerRef.current);
          timerRef.current = null;
        }
        commitValue(localVal);
        if (props.onBlur) props.onBlur(e);
      };

      const handleKeyDown = (e) => {
        if (e.key === "Enter") {
          if (timerRef.current) {
            clearTimeout(timerRef.current);
            timerRef.current = null;
          }
          commitValue(localVal);
        }
        if (props.onKeyDown) props.onKeyDown(e);
      };

      return (
        <input
          {...props}
          type={type}
          value={localVal ?? ''}
          onFocus={() => { isFocusedRef.current = true; }}
          onChange={handleChange}
          onBlur={handleBlur}
          onKeyDown={handleKeyDown}
        />
      );
    });

    // --- SAFE & DEBOUNCED CUSTOM HOOK FOR LOCAL STORAGE PERSISTENCE ---
    function useStickyState(defaultValue, key) {
      const [value, setValue] = useState(() => {
        try {
          const stickyValue = window.localStorage.getItem(key);
          return stickyValue !== null ? JSON.parse(stickyValue) : defaultValue;
        } catch (err) {
          console.warn(`Failed to parse localStorage key "${key}":`, err);
          return defaultValue;
        }
      });

      useEffect(() => {
        const timer = setTimeout(() => {
          try {
            window.localStorage.setItem(key, JSON.stringify(value));
          } catch (err) {
            console.warn(`Failed to save localStorage key "${key}":`, err);
          }
        }, 250);
        return () => clearTimeout(timer);
      }, [key, value]);

      return [value, setValue];
    }

      const removeRoofType = (indexToRemove) => { if (assemblies.roofs.length <= 1) return; setAssemblies(prev => ({ ...prev, roofs: prev.roofs.filter((_, idx) => idx !== indexToRemove) })); if (activeRoofIndex >= indexToRemove && activeRoofIndex > 0) setActiveRoofIndex(prev => prev - 1); };
      
      const addFloorType = () => {
        setAssemblies(prev => ({
          ...prev,
          floors: [...prev.floors, {
            id: generateId(),
            name: `Floor ${prev.floors.length + 1}`,
            includeSurfaces: false,
            floorType: 'ground',
            floorHeating: false,
            layers: prev.floors[0].layers.map(l => ({ ...l, id: generateId() }))
          }]
        }));
        setActiveFloorIndex(assemblies.floors.length);
      };
      const removeFloorType = (indexToRemove) => { if (assemblies.floors.length <= 1) return; setAssemblies(prev => ({ ...prev, floors: prev.floors.filter((_, idx) => idx !== indexToRemove) })); if (activeFloorIndex >= indexToRemove && activeFloorIndex > 0) setActiveFloorIndex(prev => prev - 1); };

      const updateAssemblyName = (name) => updateCurrentAssembly(prev => ({ ...prev, name }));
      const solveCompliance = (layerId) => {
        const layer = layers.find(l => l.id === layerId);
        if (!layer || layer.type !== 'material' || layer.kValue <= 0) return;
        let gap = activeTab === 'roofs' ? Math.max(targets.R_up - totals.R_up, targets.R_down - totals.R_down) : targets.R - totals.R;
        if (gap <= 0) return;
        const additionalThicknessMm = gap * layer.kValue * 1000;
        const newThickness = Math.ceil((layer.thickness + additionalThicknessMm) / 5) * 5; 
        handleLayerAction('update', layerId, 'thickness', newThickness);
      };

      const handleGlazingAction = (tab, action, id, field, value) => {
        if (tab === 'windows') {
          setFenestration(prev => {
            let newWindows = [...prev.windows];
            if (action === 'add') newWindows.push({ id: generateId(), reference: `W${newWindows.length + 1}`, storey: value, name: 'New Window', qty: 1, width: 1.0, height: 1.0, uValue: 5.20, shgc: 0.60, shadingStatus: 'unshaded', glazingType: 'single_low_e' });
            else if (action === 'remove') newWindows = newWindows.filter(w => w.id !== id);
            else if (action === 'update') newWindows = newWindows.map(w => w.id === id ? { ...w, [field]: value } : w);
            else if (action === 'preset') {
              const preset = WINDOW_PRESETS.find(p => p.name === value);
              if (preset) newWindows = newWindows.map(w => w.id === id ? { ...w, uValue: preset.uValue, shgc: preset.shgc, glazingType: preset.type } : w);
            }
            return { ...prev, windows: newWindows };
          });
        } else if (tab === 'skylights') {
          setSkylights(prev => {
            let newSkylights = [...prev];
            if (action === 'add') newSkylights.push({ id: generateId(), reference: `S${newSkylights.length + 1}`, spaceId: value, name: 'New Skylight', qty: 1, width: 1.0, height: 1.0, uValue: 5.80, shgc: 0.75 });
            else if (action === 'remove') newSkylights = newSkylights.filter(s => s.id !== id);
            else if (action === 'update') newSkylights = newSkylights.map(s => s.id === id ? { ...s, [field]: value } : s);
            else if (action === 'preset') {
              const preset = WINDOW_PRESETS.find(p => p.name === value);
              if (preset) newSkylights = newSkylights.map(s => s.id === id ? { ...s, uValue: preset.uValue, shgc: preset.shgc } : s);
            }
            return newSkylights;
          });
        }
      };

      const handleHvacAction = (action, id, field, value) => {
        setHvacEquipment(prev => {
          let newHvac = [...prev];
          if (action === 'add') newHvac.push({ id: generateId(), name: `AC Unit ${newHvac.length + 1}`, type: 'unitary_split', capacity: 10, copC: 3.0, copH: 3.0, resViolation: false });
          else if (action === 'remove') newHvac = newHvac.filter(h => h.id !== id);
          else if (action === 'update') newHvac = newHvac.map(h => h.id === id ? { ...h, [field]: value } : h);
          return newHvac;
        });
      };

      const handleWaterAction = (type, action, id, field, value) => {
        const setter = type === 'equipment' ? setWaterEquipment : setWaterPipes;
        setter(prev => {
          let newData = [...prev];
          if (action === 'add') {
            if (type === 'equipment') newData.push({ id: generateId(), name: `Solar / Heat Pump`, yield: 150 });
            else newData.push({ id: generateId(), reference: `Pipe Loop`, diameter: 22, insulated: true });
          }
          else if (action === 'remove') newData = newData.filter(item => item.id !== id);
          else if (action === 'update') newData = newData.map(item => item.id === id ? { ...item, [field]: value } : item);
          return newData;
        });
      };

      const handleLightingAction = (action, id, field, value) => {
        setLightingFixtures(prev => {
          let newData = [...prev];
          if (action === 'add') newData.push({ id: generateId(), spaceId: value, name: 'New Fixture', type: 'LED', qty: 1, watts: 10 });
          else if (action === 'remove') newData = newData.filter(f => f.id !== id);
          else if (action === 'update') newData = newData.map(f => f.id === id ? { ...f, [field]: value } : f);
          return newData;
        });
      };

      const getLayerStyle = (name) => {
        const n = (name || '').toLowerCase();
        if (n.includes('foil') || n.includes('radiant')) return { backgroundColor: 'rgba(239, 68, 68, 0.1)', border: '2px dashed #ef4444' };
        if (n.includes('brick')) return { backgroundColor: '#bd5b3b' };
        if (n.includes('plaster') || n.includes('render') || n.includes('screed')) return { backgroundColor: '#d4d4d8' };
        if (n.includes('concrete')) return { backgroundColor: '#94a3b8' };
        if (n.includes('insulation') || n.includes('eps') || n.includes('xps') || n.includes('glasswool')) return { backgroundColor: '#fef08a' };
        if (n.includes('air') || n.includes('space') || n.includes('cavity')) return { backgroundColor: '#eff6ff', backgroundImage: 'radial-gradient(#93c5fd 1px, transparent 1px)', backgroundSize: '8px 8px' };
        if (n.includes('board') || n.includes('gypsum')) return { backgroundColor: '#e7e5e4' };
        if (n.includes('steel') || n.includes('iron')) return { backgroundColor: '#64748b' };
        if (n.includes('timber') || n.includes('wood')) return { backgroundColor: '#d97706' };
        return { backgroundColor: '#e2e8f0' };
      };

      const generateVisualizerHtml = (layersToRender, incSurfaces, isVert, outLbl, inLbl) => {
          const totThick = layersToRender.reduce((acc, l) => acc + Number(l.thickness || 0), 0);
          
          let html = `<div style="width: 100%; display: flex; border: 2px solid #cbd5e1; border-radius: 8px; overflow: hidden; background-color: #f8fafc; margin-bottom: 20px; box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06); ${isVert ? 'height: 150px; flex-direction: row;' : 'height: 250px; flex-direction: column;'}">`;

          if (incSurfaces) {
              html += `<div style="${isVert ? 'width: 30px; border-right: 1px solid #e2e8f0;' : 'height: 25px; border-bottom: 1px solid #e2e8f0;'} background-color: #eff6ff; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                  <div style="color: #3b82f6; font-weight: bold; font-size: 8px; letter-spacing: 1px; text-align: center; width: 100%; ${isVert ? 'writing-mode: vertical-rl; transform: rotate(180deg);' : ''}">${escapeHtml(outLbl)}</div>
              </div>`;
          }

          layersToRender.forEach(layer => {
              const r = totThick > 0 ? (layer.thickness / totThick) * 100 : 0;
              const bg = getLayerStyle(layer.appearance || layer.name);
              const rVal = layer.type === 'material' ? (layer.kValue > 0 ? (layer.thickness / 1000) / layer.kValue : 0) : parseFloat(layer.rValue) || 0;
              
              let sStr = Object.entries(bg).map(([k, v]) => {
                  const kb = k.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
                  return `${kb}: ${v};`;
              }).join(' ');

              html += `<div style="${sStr} position: relative; display: flex; align-items: center; justify-content: center; box-sizing: border-box; flex-grow: ${layer.thickness}; flex-basis: ${r}%; ${isVert ? `border-right: 1px solid rgba(15,23,42,0.1); min-width: ${layer.thickness > 0 ? '24px' : '0'}; height: 100%;` : `border-bottom: 1px solid rgba(15,23,42,0.1); min-height: ${layer.thickness > 0 ? '24px' : '0'}; width: 100%;`}">`;
              
              if (layer.thickness >= 5) {
                  html += `<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 4px;">
                      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 280px; max-width: 280px; text-align: center; ${isVert ? 'transform: rotate(-90deg);' : ''}">
                          <span style="font-size: 10px; font-weight: bold; color: #334155; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;">${escapeHtml(layer.name)}</span>
                          <span style="font-size: 9px; font-weight: bold; color: #64748b; margin-top: 2px;">${layer.thickness}mm | R-${rVal.toFixed(2)}</span>
                      </div>
                  </div>`;
              }
              html += `</div>`;
          });

          if (incSurfaces) {
              html += `<div style="${isVert ? 'width: 30px; border-left: 1px solid #e2e8f0;' : 'height: 25px; border-top: 1px solid #e2e8f0;'} background-color: #eff6ff; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                  <div style="color: #3b82f6; font-weight: bold; font-size: 8px; letter-spacing: 1px; text-align: center; width: 100%; ${isVert ? 'writing-mode: vertical-rl; transform: rotate(180deg);' : ''}">${escapeHtml(inLbl)}</div>
              </div>`;
          }

          html += `</div>`;
          return html;
      };

      const getTabHTML = (tab) => {
        if (isExempt) return `<div class="box"><h2 style="color:#059669; margin:0;">EXEMPT PROJECT</h2><p>Occupancy Class ${escapeHtml(occupancy)} is exempt from SANS 10400-XA calculations per Clause 4.2.</p></div>`;
        let h = '';
        if (tab === 'walls') {
            h += '<h2>Walls Assembly Schedule (Clause 5.5)</h2>';
            assemblies.walls.forEach((w, index) => {
                if (index > 0) h += `<div class="page-break"></div>`;
                const phys = calculateAssemblyPhysics(w.layers, 'walls', w.includeSurfaces);
                const tgt = getTargetRequirements('walls', phys.surfaceMass, zone);
                const pass = phys.R >= tgt.R;
                h += `<div class="box" style="margin-bottom:20px;">
                    <h4>${escapeHtml(w.name)}</h4>
                    <p>Class: ${phys.surfaceMass >= 270 ? 'Heavyweight (≥ 270 kg/m²)' : 'Lightweight (< 270 kg/m²)'}</p>
                    <p>Target R-Value: ${tgt.R.toFixed(2)}</p>
                    <p>Total R-Value: <span class="${pass?'pass':'fail'}">${phys.R.toFixed(2)}</span></p>
                    <h4 style="margin-top:15px; margin-bottom:5px; font-size:12px; color:#64748b; text-transform:uppercase;">Assembly Cross-Section</h4>
                    ${generateVisualizerHtml(w.layers, w.includeSurfaces, true, 'OUTSIDE', 'INSIDE')}
                    <div style="font-size:12px; color:#475569; margin-top:10px; padding: 10px; background-color: #f1f5f9; border-radius: 6px; border: 1px solid #e2e8f0;">
                        <strong>R-Value Calculation:</strong> ${phys.breakdown.join(' + ')} = <strong style="color: #0f172a;">Total R ${phys.R.toFixed(2)}</strong>
                    </div>
                </div>`;
            });
        }
        else if (tab === 'roofs') {
            h += '<h2>Roof Assembly Schedule (Clause 5.6)</h2>';
            assemblies.roofs.forEach((r, index) => {
                if (index > 0) h += `<div class="page-break"></div>`;
                const p = calculateAssemblyPhysics(r.layers, 'roofs', r.includeSurfaces, r.isPitchedRoof);
                const t = getTargetRequirements('roofs', 0, zone);
                const pass = p.R_up >= t.R_up && p.R_down >= t.R_down;
                h += `<div class="box" style="margin-bottom:20px;">
                    <h4>${escapeHtml(r.name)}</h4>
                    <p>Profile: ${r.isPitchedRoof ? 'Pitched' : 'Flat'}</p>
                    <table><tr><th>Direction</th><th>Target R</th><th>Total R</th></tr><tr><td>WINTER (Up)</td><td>${t.R_up > 0 ? t.R_up.toFixed(2) : 'N/A'}</td><td>${p.R_up.toFixed(2)}</td></tr><tr><td>SUMMER (Down)</td><td>${t.R_down > 0 ? t.R_down.toFixed(2) : 'N/A'}</td><td>${p.R_down.toFixed(2)}</td></tr></table><p class="${pass?'pass':'fail'}">Status: ${pass?'COMPLIANT':'NON-COMPLIANT'}</p>
                    <h4 style="margin-top:15px; margin-bottom:5px; font-size:12px; color:#64748b; text-transform:uppercase;">Assembly Cross-Section</h4>
                    ${generateVisualizerHtml(r.layers, r.includeSurfaces, false, 'OUTSIDE (ROOF)', 'INSIDE (CEILING)')}
                    <div style="font-size:12px; color:#475569; margin-top:10px; padding: 10px; background-color: #f1f5f9; border-radius: 6px; border: 1px solid #e2e8f0;">
                        <div style="margin-bottom:4px;"><strong>WINTER (Up) Calculation:</strong> ${p.breakdownUp.join(' + ')} = <strong style="color: #0f172a;">Total R ${p.R_up.toFixed(2)}</strong></div>
                        <div><strong>SUMMER (Down) Calculation:</strong> ${p.breakdownDown.join(' + ')} = <strong style="color: #0f172a;">Total R ${p.R_down.toFixed(2)}</strong></div>
                    </div>
                </div>`;
            });
        }
        else if (tab === 'floors') {
            h += '<h2>Floor Assembly Schedule (Clause 5.4)</h2>';
            assemblies.floors.forEach((f, index) => {
                if (index > 0) h += `<div class="page-break"></div>`;
                const p = calculateAssemblyPhysics(f.layers, 'floors', f.includeSurfaces, false, f.floorType, f.floorHeating);
                const t = getTargetRequirements('floors', 0, zone, f.floorType, f.floorHeating);
                const pass = p.R >= t.R;
                h += `<div class="box" style="margin-bottom:20px;">
                    <h4>${escapeHtml(f.name)}</h4>
                    <p>System: ${f.floorType === 'suspended' ? 'Suspended Slab' : 'Slab on Ground'} ${f.floorHeating ? '(Heated)' : ''}</p>
                    <p>Target R-Value: ${t.R.toFixed(2)}</p>
                    <p>Total R-Value: <span class="${pass?'pass':'fail'}">${p.R.toFixed(2)}</span></p>
                    <h4 style="margin-top:15px; margin-bottom:5px; font-size:12px; color:#64748b; text-transform:uppercase;">Assembly Cross-Section</h4>
                    ${generateVisualizerHtml(f.layers, f.includeSurfaces, false, 'INSIDE (TOP)', f.floorType === 'ground' ? 'OUTSIDE (GROUND)' : 'OUTSIDE (CRAWLSPACE)')}
                    <div style="font-size:12px; color:#475569; margin-top:10px; padding: 10px; background-color: #f1f5f9; border-radius: 6px; border: 1px solid #e2e8f0;">
                        <strong>R-Value Calculation:</strong> ${p.breakdown.join(' + ')} = <strong style="color: #0f172a;">Total R ${p.R.toFixed(2)}</strong>
                    </div>
                </div>`;
            });
        }
        else if (tab === 'fenestration') {
            h += '<h2>Fenestration Schedule (Clause 5.3)</h2>';
            if (fenestrationData.global.totalWinArea === 0) return h + '<p>No fenestration specified.</p>';
            const g = fenestrationData.global;
            
            h += `<div class="box">
                <p><strong>Total Area:</strong> ${g.totalWinArea.toFixed(2)} m² (Global Ratio: ${g.ratio.toFixed(1)}%)</p>
                <p><strong>Global U-Value:</strong> ${g.aggU.toFixed(2)} <span style="color:#64748b; font-size: 12px;">(Target: ${g.exempt ? 'Exempt ≤ 20%' : '≤ ' + (g.maxU ? g.maxU.toFixed(2) : 'N/A')})</span></p>
                <p><strong>Global SHGC:</strong> ${g.aggSHGC.toFixed(2)} <span style="color:#64748b; font-size: 12px;">(Target: ${g.exempt ? 'Exempt ≤ 20%' : '≤ ' + (g.maxSHGC ? g.maxSHGC.toFixed(2) : 'N/A')})</span></p>
                <p style="margin-top: 10px;" class="${g.isCompliant?'pass':'fail'}"><strong>Status:</strong> ${g.isCompliant?'COMPLIANT':'NON-COMPLIANT'}</p>
            </div>`;
            
            fenestrationData.storeys.filter(s => s.windows.length > 0).forEach(s => {
                h += `<div class="storey-header" style="display:flex; justify-content:space-between; align-items:center;">
                        <span>Storey ${s.storeyIndex + 1} (${s.isCompliant ? 'PASS' : 'FAIL'})</span>
                        <span style="font-size:12px; font-weight:normal; color:#475569;">Ratio: ${s.ratio.toFixed(1)}% | Agg U: ${s.aggU.toFixed(2)} / ${s.exempt ? 'Exempt' : s.maxU.toFixed(2)} | Agg SHGC: ${s.aggSHGC.toFixed(2)} / ${s.exempt ? 'Exempt' : s.maxSHGC.toFixed(2)}</span>
                      </div>
                      <table><thead><tr><th>Ref</th><th>Description</th><th>Shading</th><th>Qty</th><th>W x H</th><th>Area (A)</th><th>U</th><th>U × A</th><th>SHGC</th><th>SHGC × A</th></tr></thead><tbody>`;
                s.windows.forEach(w => { 
                    const area = w.qty * w.width * w.height;
                    const uA = area * w.uValue;
                    const activeShgc = w.shadingStatus === 'south' ? 0 : w.shgc;
                    const shgcA = area * activeShgc;
                    h += `<tr><td>${escapeHtml(w.reference)}</td><td>${escapeHtml(w.name)}</td><td style="text-transform:capitalize;">${escapeHtml(w.shadingStatus)}</td><td>${w.qty}</td><td>${w.width}x${w.height}</td><td>${area.toFixed(2)}</td><td>${w.uValue.toFixed(2)}</td><td style="color:#475569; background:#f8fafc;">${uA.toFixed(2)}</td><td>${w.shgc.toFixed(2)}${w.shadingStatus === 'south' ? ' (Exempt)' : ''}</td><td style="color:#475569; background:#f8fafc;">${shgcA.toFixed(2)}</td></tr>`; 
                });
                h += `</tbody></table>`;
            });
        }
        else if (tab === 'skylights') {
            h += '<h2>Skylights & Roof Lights Schedule (Clause 5.3.9)</h2>';
            if (skylightData.global.totalSkyArea === 0) return h + '<p>No skylights specified.</p>';
            
            h += `<div class="box">
                <p><strong>Total Project Rooflight Area:</strong> ${skylightData.global.totalSkyArea.toFixed(2)} m² (Ratio: ${skylightData.global.ratio.toFixed(1)}%)</p>
                <p style="margin-top: 10px;" class="${skylightData.global.isCompliant?'pass':'fail'}"><strong>Status:</strong> ${skylightData.global.isCompliant?'ALL SPACES COMPLIANT':'NON-COMPLIANT SPACES FOUND'}</p>
            </div>`;
            
            skylightData.spaces.filter(s => s.skylights.length > 0).forEach(s => {
                h += `<div class="storey-header" style="display:flex; justify-content:space-between; align-items:center;">
                        <span>${escapeHtml(s.name)} <span style="font-size:12px; font-weight:normal; color:#64748b;">(Storey ${s.storey + 1})</span></span>
                        <span style="font-size:12px; font-weight:normal; color:#475569;">Ratio: ${s.ratio.toFixed(1)}% | Agg U: ${s.aggU.toFixed(2)} / ${s.exempt ? 'NA' : s.maxU.toFixed(2)} | Agg SHGC: ${s.aggSHGC.toFixed(2)} / ${s.exempt ? 'NA' : s.maxSHGC.toFixed(2)}</span>
                      </div>
                      <table><thead><tr><th>Ref</th><th>Description</th><th>Qty</th><th>W x L</th><th>Area (A)</th><th>U</th><th>U × A</th><th>SHGC</th><th>SHGC × A</th></tr></thead><tbody>`;
                s.skylights.forEach(sky => { 
                    const area = sky.qty * sky.width * sky.height;
                    const uA = area * sky.uValue;
                    const shgcA = area * sky.shgc;
                    h += `<tr><td>${escapeHtml(sky.reference)}</td><td>${escapeHtml(sky.name)}</td><td>${sky.qty}</td><td>${sky.width}x${sky.height}</td><td>${area.toFixed(2)}</td><td>${sky.uValue.toFixed(2)}</td><td style="color:#475569; background:#f8fafc;">${uA.toFixed(2)}</td><td>${sky.shgc.toFixed(2)}</td><td style="color:#475569; background:#f8fafc;">${shgcA.toFixed(2)}</td></tr>`; 
                });
                h += `</tbody></table>`;
            });
        }
        else if (tab === 'lighting') {
            h += '<h2>Lighting Power Density Schedule (Clause 6.2)</h2>';
            if (!lightingData.hasFixtures) return h + '<p>No fixtures specified.</p>';
            
            h += `<div class="box">
                <p><strong>Total Installed Power:</strong> ${lightingData.globalWatts.toFixed(1)} W</p>
                <p><strong>Calculated Global LPD:</strong> ${lightingData.globalLpd.toFixed(2)} W/m²</p>
                <p><strong>Target Limit (Table 10):</strong> ${lightingData.targetLPD !== undefined ? lightingData.targetLPD + ' W/m²' : 'No Limit / Exempt'}</p>
                <p style="margin-top: 10px;" class="${lightingData.isCompliant || lightingData.isResidentialExempt?'pass':'fail'}"><strong>Status:</strong> ${lightingData.isCompliant || lightingData.isResidentialExempt?'COMPLIANT':'NON-COMPLIANT'}</p>
            </div>`;
            
            lightingData.spaces.filter(s => s.fixtures.length > 0).forEach(s => {
                h += `<div class="storey-header" style="display:flex; justify-content:space-between; align-items:center;">
                        <span>${escapeHtml(s.name)}</span>
                        <span style="font-size:12px; font-weight:normal; color:#475569;">Area: ${s.area} m² | Space Power: ${s.spaceWatts} W | Space LPD: ${s.spaceLpd.toFixed(2)} W/m²</span>
                      </div>
                      <table><thead><tr><th>Description</th><th>Type</th><th>Qty</th><th>Watts / Unit</th><th>Total Watts</th></tr></thead><tbody>`;
                s.fixtures.forEach(f => { h += `<tr><td>${escapeHtml(f.name)}</td><td>${escapeHtml(f.type)}</td><td>${f.qty}</td><td>${f.watts} W</td><td style="font-weight:bold;">${(f.qty*f.watts).toFixed(1)} W</td></tr>`; });
                h += `</tbody></table>`;
            });
        }
        else if (tab === 'water') {
            h += '<h2>Hot Water Supply Schedule (Clause 6.1)</h2>';
            if (waterExempt) return h + '<div class="box"><p class="pass">EXEMPT (No Hot Water Services Installed)</p></div>';
            h += `<div class="box"><p>Total Demand: ${waterData.totalDemand.toFixed(1)} L/day</p><p>Target 50% Yield: ${waterData.targetYield.toFixed(1)} L/day</p><p>Alternative Yield: ${waterData.totalYield.toFixed(1)} L/day</p><p class="${waterData.isCompliant?'pass':'fail'}">Status: ${waterData.isCompliant?'COMPLIANT':'NON-COMPLIANT'}</p></div>`;
            if (waterEquipment.length > 0) {
                h += `<table><thead><tr><th>Ref</th><th>Description</th><th>Yield (L/day)</th></tr></thead><tbody>`;
                waterEquipment.forEach((eq, index) => h += `<tr><td>HW-${index + 1}</td><td>${escapeHtml(eq.name)}</td><td>${eq.yield} L</td></tr>`);
                h += `</tbody></table>`;
            }
            h += `<h3>Pipe Insulation Schedule (SANS 10252-1)</h3>`;
            if (waterPipes.length > 0) {
                h += `<table><thead><tr><th>Reference</th><th>Diameter (mm)</th><th>Target R-Value</th><th>Compliant</th></tr></thead><tbody>`;

                <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
                  <div className="bg-slate-100 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                    <h2 className="font-bold text-slate-800 flex items-center gap-2"><Settings className="w-5 h-5 text-indigo-600" /> Office Configuration</h2>
                    <button onClick={() => setIsSettingsModalOpen(false)} className="text-slate-400 hover:text-slate-600 transition-colors"><X className="w-5 h-5" /></button>
                  </div>
                  <div className="p-6 space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Company Name</label>
                      <DebouncedInput type="text" value={officeInfo.companyName} onChange={(val) => handleOfficeUpdate('companyName', val)} className="w-full text-sm border-slate-300 rounded-lg p-2.5 border" placeholder="Enter company name" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Registered Professional</label>
                      <DebouncedInput type="text" value={officeInfo.registeredProfessional} onChange={(val) => handleOfficeUpdate('registeredProfessional', val)} className="w-full text-sm border-slate-300 rounded-lg p-2.5 border" placeholder="e.g. Jane Doe" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">SACAP Registration Number</label>
                      <DebouncedInput type="text" value={officeInfo.sacapNumber} onChange={(val) => handleOfficeUpdate('sacapNumber', val)} className="w-full text-sm border-slate-300 rounded-lg p-2.5 border" placeholder="e.g. PrArch 12345" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Company Logo (Max 1MB)</label>
                      <input type="file" accept="image/*" onChange={handleLogoUpload} className="w-full text-sm border-slate-300 rounded-lg p-2 border file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100" />
                      {officeInfo.logoDataUrl && (
                        <div className="mt-3 relative inline-block">
                          <img src={officeInfo.logoDataUrl} alt="Logo Preview" className="h-12 object-contain border rounded p-1" />
                          <button onClick={() => handleOfficeUpdate('logoDataUrl', '')} className="absolute -top-2 -right-2 bg-red-100 text-red-600 rounded-full p-1 hover:bg-red-200"><X className="w-3 h-3" /></button>
                        </div>
                      )}
                    </div>
                  </div>
                  <div className="p-4 border-t border-slate-200 bg-slate-50 flex justify-end">
                    <button onClick={() => setIsSettingsModalOpen(false)} className="px-5 py-2 bg-indigo-600 text-white rounded-lg text-sm font-bold shadow-sm hover:bg-indigo-500">Save & Close</button>
                  </div>
                </div>
              </div>
            )}

            {/* --- HELP MODAL --- */}
            {isHelpModalOpen && (
              <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden">
                  <div className="bg-slate-100 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                    <h2 className="font-bold text-slate-800 flex items-center gap-2"><HelpCircle className="w-5 h-5 text-indigo-600" /> Help & About</h2>
                    <button onClick={() => setIsHelpModalOpen(false)} className="text-slate-400 hover:text-slate-600 transition-colors"><X className="w-5 h-5" /></button>
                  </div>
                  <div className="p-6 space-y-4 text-sm text-slate-600">
                    <p><strong>XA Express</strong> is a Deemed-to-Satisfy calculator designed for compliance with the SANS 10400-XA:2026 (3rd Edition) regulations.</p>
                    <hr className="border-slate-200" />
                    <h3 className="font-bold text-slate-800">Quick Tips:</h3>
                    <ul className="list-disc pl-5 space-y-2">
                      <li>Ensure your <strong>Climate Zone</strong> is set correctly on the Project tab, as it dictates all baseline performance targets.</li>
                      <li>Use the <strong>Layer Builder</strong> in the Walls, Roofs, and Floors tabs to construct assemblies from outside to inside.</li>
                      <li>If your project is in an <strong>SCCP Area</strong>, single Low-E glazing will automatically flag as non-compliant due to condensation risks.</li>
                      <li>All data is saved locally in your browser cache. Clearing your browser data will reset the application.</li>
                    </ul>
                    <div className="mt-6 space-y-4">
                      <div className="p-4 bg-indigo-50 rounded-xl border border-indigo-100 text-center transition-colors hover:bg-indigo-100/50">
                        <a href="https://www.cpdcentral.co.za/courses/mastering-sans-10400-XA" target="_blank" rel="noopener noreferrer" className="text-sm font-bold text-indigo-700 hover:text-indigo-800 flex items-center justify-center gap-1.5">
                          Sign up for the Mastering SANS 10400-XA 3rd edition course on CPD Central <ExternalLink className="w-4 h-4" />
                        </a>
                      </div>
                      
                      <div className="flex flex-col sm:flex-row justify-between items-center gap-2 pt-4 border-t border-slate-100 text-xs text-slate-400">
                        <span>Build Version: {BUILD_VERSION}</span>
                        <span>
                          &copy; 2026 <a href="https://peterleroux.co.za/sans-10400-xa/" target="_blank" rel="noopener noreferrer" className="text-indigo-400 hover:text-indigo-600 hover:underline transition-colors">Peter le Roux</a>
                        </span>
                      </div>
                    </div>
                  </div>
                  <div className="p-4 border-t border-slate-200 bg-slate-50 flex justify-end">
                    <button onClick={() => setIsHelpModalOpen(false)} className="px-5 py-2 bg-slate-800 text-white rounded-lg text-sm font-bold shadow-sm hover:bg-slate-700">Close</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
