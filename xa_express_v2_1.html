    const DECLARATION_ITEMS = [
      { id: "seal_env_5_7_1", tab: "project", clause: "Clause 5.7.1", title: "Building Envelope Air-Leakage Construction", desc: "Roofs, external walls, floors, and external fabric openings (windows and doors) forming the building envelope are constructed to minimize air leakage (e.g., caulking, skirtings, architraves, or cornices).", allowNa: false, defaultTypical: "compliant" },
      { id: "seal_doors_5_7_4", tab: "project", clause: "Clause 5.7.4", title: "External Door Edge Weather-Stripping / Compressible Seals", desc: "A foam or rubber compressible strip or fibrous seal to restrict air leakage is fitted to each edge of every external door and similar opening serving a conditioned space or habitable room.", allowNa: true, naLabel: "No external doors serving habitable or conditioned spaces", defaultTypical: "compliant" },
      { id: "seal_flue_5_7_3", tab: "project", clause: "Clause 5.7.3", title: "Open Solid-Fuel Appliance Chimney / Flue Damper", desc: "The chimney or flue of any open solid-fuel burning appliance (timber, coal, etc.) is provided with a closeable damper or flap to seal the chimney or flue.", allowNa: true, naLabel: "No open solid-fuel burning appliance", defaultTypical: "na" },
      { id: "wall_masonry_5_5", tab: "walls", clause: "Table 6 Note a", title: "Heavyweight Masonry Wall Internal & External Plastering", desc: "Heavyweight masonry walls (≥ 270 kg/m²) other than FBX, FBS, or FBA clay bricks or high-density concrete face bricks/blocks are plastered internally and externally.", allowNa: true, naLabel: "FBX/FBS/FBA clay or high-density concrete face brick/block", defaultTypical: "compliant", getAutoNa: (ctx) => !ctx.hasHeavyNonCat1Wall ? "No Table 6 heavyweight walls specified" : null },
      { id: "wall_metal_5_5_4", tab: "walls", clause: "Clause 5.5.4", title: "Metal Wall Framing Thermal Break (R ≥ 0,20 m²·K/W)", desc: "Any walling construction having metal sheet, metal studs, metal tracks, or metal battens fixed to each other incorporates a thermal break material of R ≥ 0,20 m²·K/W between the metal structural elements.", allowNa: true, naLabel: "No fixed metal-to-metal wall framing", defaultTypical: "na" },
      { id: "wall_attach_5_5_5", tab: "walls", clause: "Clause 5.5.5", title: "Thermal Separation of Excluded Attached Spaces", desc: "Attached garages, enclosed verandahs, glasshouses, solariums, storerooms, or pool enclosures (Figure 7) excluded from the building envelope are separated so they do not compromise the thermal performance of the main building envelope.", allowNa: true, naLabel: "No excluded attached spaces", defaultTypical: "na" },
      { id: "roof_cont_5_6_1", tab: "roofs", clause: "Clause 5.6.1", title: "Continuous Thermal Barrier & Safe Service Clearances", desc: "Roof/ceiling thermal insulation abuts or overlaps adjoining insulation (or is sealed), forms a continuous thermal barrier with ceilings, walls, bulkheads, or floors, and maintains safe clearances from flues, recessed fittings, transformers, and services.", allowNa: true, naLabel: "Existing unaltered roof", defaultTypical: "compliant", getAutoNa: (ctx) => ctx.allRoofsThatch ? "Thatched roof assembly (Clause 5.6.6)" : null },
      { id: "roof_overlap_5_6_7", tab: "roofs", clause: "Clause 5.6.7", title: "Ceiling Bulk Insulation Wall Overlap (≥ 50 mm)", desc: "Bulk insulation installed in ceilings overlaps the wall member by not less than 50 mm, or is tightly fitted against a wall where there is no insulation in the wall.", allowNa: true, naLabel: "No ceiling-level bulk insulation", defaultTypical: "compliant", getAutoNa: (ctx) => ctx.allRoofsThatch ? "Thatched roof assembly (Clause 5.6.6)" : null },
      { id: "roof_spacer_5_6_3", tab: "roofs", clause: "Clauses 5.6.3 & 5.6.4", title: "Metal Cladding Spacer or Continuous Packer System", desc: "Where faced flexible bulk insulation is installed between the underside of roof cladding and supporting purlins/girts, a full-depth spacer system (5.6.3) or continuous packer (5.6.4, cavity ≥ 80 % of required thickness per 3.16) compatible with the cladding is provided.", allowNa: true, naLabel: "No flexible bulk insulation compressed under cladding", defaultTypical: "na", getAutoNa: (ctx) => ctx.allRoofsThatch ? "Thatched roof assembly (Clause 5.6.6)" : null },
      { id: "seal_attic_5_7_2", tab: "roofs", clause: "Clause 5.7.2", title: "Ceiling Void / Attic Infiltration Sealing & Tiled Roof Underlay", desc: "Ceiling voids and attics (except thatched roofs, and except naturally ventilated buildings in Energy Zone 5H) minimize air infiltration with sealed wall-plate and roof junctions; all tiled roofs have a tile underlay or radiant barrier.", allowNa: true, naLabel: "Concrete roof slab or Zone 5H nat. vent. non-tiled roof", defaultTypical: "compliant", getAutoNa: (ctx) => ctx.allRoofsThatch ? "Exempt — Thatched roof per Clause 5.7.2" : null },
